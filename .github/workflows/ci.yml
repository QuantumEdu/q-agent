name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Test & Integrity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure cockpit home
        run: echo "Q_COCKPIT_HOME=$RUNNER_TEMP/q-agent-cockpit" >> "$GITHUB_ENV"

      - name: Verify Python syntax (py_compile)
        run: |
          python -m compileall -q tools tests examples evals

      - name: Install lint and type-check tools
        run: python -m pip install "ruff==0.8.6" "mypy==1.14.1"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy --config-file mypy.ini tools

      - name: Run unit & regression test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Validate skill.json schema & JSON format
        run: |
          python -m json.tool skill.json > /dev/null

      - name: Verify CLI Tools --help smoke execution
        run: |
          python tools/q-cockpit/q_cockpit.py --help
          python tools/q-cockpit/q_cockpit_plus.py --help
          python tools/q-checklist/q_checklist.py --help
          python tools/q-audit-validator/validate_audit.py --help
          python tools/q-audit-aggregator/generate_report.py --help
          python tools/q-audit-runner/run_audit.py --help
          python tools/q-benchmark/benchmark.py --help
          python tools/q-tasks/q_tasks.py --help
          bash -n bin/q-agent
          bash bin/q-agent --help
          bash bin/q-agent capabilities --backend local

      - name: Run local benchmark smoke check
        run: >
          python tools/q-benchmark/benchmark.py --project . --iterations 1
          --json
