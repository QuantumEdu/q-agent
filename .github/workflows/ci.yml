name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Test & Integrity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python syntax (py_compile)
        run: |
          python -m py_compile tools/q-cockpit/q_cockpit.py
          python -m py_compile tools/q-cockpit/q_cockpit_plus.py
          python -m py_compile tools/q-cockpit/cockpit_services.py
          python -m py_compile tools/q-cockpit/recovery.py
          python -m py_compile tools/q-checklist/q_checklist.py
          python -m py_compile tools/q-audit-validator/validate_audit.py
          python -m py_compile tools/q-audit-aggregator/generate_report.py
          python -m py_compile tools/q-audit-runner/run_audit.py
          python -m py_compile tools/q-audit-evidence/evidence.py
          python -m py_compile tools/q-audit-lifecycle/audit_lifecycle.py
          python -m py_compile tools/q-benchmark/benchmark.py
          python -m py_compile tests/*.py

      - name: Run unit & regression test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Validate skill.json schema & JSON format
        run: |
          python -m json.tool skill.json > /dev/null

      - name: Verify CLI Tools --help smoke execution
        run: |
          python tools/q-cockpit/q_cockpit.py --help
          python tools/q-cockpit/q_cockpit_plus.py --help
          python tools/q-checklist/q_checklist.py --help
          python tools/q-audit-validator/validate_audit.py --help
          python tools/q-audit-aggregator/generate_report.py --help
          python tools/q-audit-runner/run_audit.py --help
          python tools/q-benchmark/benchmark.py --help

      - name: Run local benchmark smoke check
        run: >
          python tools/q-benchmark/benchmark.py --project . --iterations 1
          --json
